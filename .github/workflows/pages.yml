# Builds and deploys the companion site (site/) to GitHub Pages on every push
# to main. The repository holds ~4 GB of run transcripts; the build never needs
# them — a partial, sparse checkout fetches only the site source and the
# summary files it reads (epochs/, repositories/, README.md).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            site
            epochs
            repositories
            README.md
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # configure-pages reports where Pages will actually serve the site: the
      # custom domain at its root once a CNAME exists, the project path
      # (/TrueArchitect-Benchmarks) before that. The build takes both from it
      # so the links are right in either state.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
